name: CD - Deploy 🚀

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Login to JFrog
      - name: Docker Login
        run: |
          docker login trialuy8zrn.jfrog.io -u ${{ secrets.JFROG_USERNAME }} -p ${{ secrets.JFROG_TOKEN }}

    

      # Pull latest image
      - name: Pull Image
        run: |
          docker pull trialuy8zrn.jfrog.io/docker-trial/myapp:latest

      # Run container
      - name: Deploy Container 🚀
        run: |
         VERSION=$(Get-Date -Format "HHmmss")

         IMAGE="trialuy8zrn.jfrog.io/docker-trial/myapp:latest"

         echo "Deploying version: $VERSION"

         docker pull $IMAGE

         docker run -d -p 0:80 `
         --name myapp_$VERSION `
         $IMAGE