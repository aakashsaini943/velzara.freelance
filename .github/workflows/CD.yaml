name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code (good practice even if not used)
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configure JFrog
      - name: Configure JFrog
        run: |
          ./jfrog config add my-server \
          --url=${{ secrets.JFROG_URL }} \
          --user=${{ secrets.JFROG_USERNAME }} \
          --apikey=${{ secrets.JFROG_TOKEN }} \
          --interactive=false    

      # Pull Docker Image
      - name: Deploy Locally (Versioned)
        run: |
          docker pull trialuy8zrn.jfrog.io/docker-trial/myapp:latest

          VERSION=$(date +%s)

          docker run -d -p 8080:80 \
          --name myapp_v-$VERSION \
          trialuy8zrn.jfrog.io/docker-trial/myapp:latest