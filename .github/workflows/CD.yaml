name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to JFrog Docker Registry
      - name: Login to JFrog Docker
        run: |
          echo ${{ secrets.JFROG_TOKEN }} | docker login trialuy8zrn.jfrog.io \
          -u ${{ secrets.JFROG_USERNAME }} \
          --password-stdin

    
      # 6. Deploy (Auto Restart Container)
      - name: Deploy Container 🔥
        run: |
          docker stop myapp || true
          docker rm myapp || true

          docker pull $REGISTRY/$IMAGE_NAME:latest

          docker run -d -p 8080:80 \
          --name myapp \
          $REGISTRY/$IMAGE_NAME:latest

      
      