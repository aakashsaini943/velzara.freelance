name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to JFrog Docker Registry
      - name: Login to JFrog Docker
        run: |
          echo ${{ secrets.JFROG_TOKEN }} | docker login trialuy8zrn.jfrog.io \
          -u ${{ secrets.JFROG_USERNAME }} \
          --password-stdin

      # 3. Pull and Run Container | stop old container 
      - name: Clean old containers
  run: |
    docker stop $(docker ps -aq) || true
    docker rm $(docker ps -aq) || true

     - name: Deploy with dynamic port
  run: |
    docker pull trialuy8zrn.jfrog.io/docker-trial/myapp:latest

    VERSION=$(date +%s)

    docker run -d -P \
    --name myapp_v-$VERSION \
    trialuy8zrn.jfrog.io/docker-trial/myapp:latest

    PORT=$(docker port myapp_v-$VERSION 80 | cut -d: -f2)

    echo "🚀 Running on port: $PORT"