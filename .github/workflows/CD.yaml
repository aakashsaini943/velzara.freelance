name: CD - Deploy 🚀

on:
  workflow_run:
    workflows: ["CI - Build & Push 🚀"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Docker Login
        run: |
          docker login trialuy8zrn.jfrog.io \
          -u ${{ secrets.JFROG_USERNAME }} \
          -p ${{ secrets.JFROG_TOKEN }}

      - name: Pull Image
        run: |
          docker pull trialuy8zrn.jfrog.io/docker-trial/myapp:latest

      # 🔥 Stop old container
      - name: Stop Old Container
        run: |
          docker stop myapp || true
          docker rm myapp || true

      # 🚀 Run new container
      - name: Run Container
        run: |
          docker run -d -p 8080:80 --name myapp \
          trialuy8zrn.jfrog.io/docker-trial/myapp:latest
