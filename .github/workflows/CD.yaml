name: CD - Deploy 🚀

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      # 1️⃣ Checkout (optional but good practice)
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Verify Docker access (DEBUG step 🔥)
      - name: Check Docker
        run: docker ps

      # 3️⃣ Login to JFrog
      - name: Docker Login
        run: |
          docker login trialuy8zrn.jfrog.io `
          -u ${{ secrets.JFROG_USERNAME }} `
          -p ${{ secrets.JFROG_TOKEN }}

      # 4️⃣ Pull latest image
      - name: Pull Image
        run: docker pull trialuy8zrn.jfrog.io/docker-trial/myapp:latest

      # 5️⃣ Stop old container (safe)
      - name: Stop Old Container
        run: |
          docker stop myapp-container || echo "No container running"
          docker rm myapp-container || echo "No container to remove"

      # 6️⃣ Run new container
      - name: Run Container
        run: |
          docker run -d -p 3000:3000 --name myapp-container trialuy8zrn.jfrog.io/docker-trial/myapp:latest

      # 7️⃣ Verify deployment
      - name: Verify
        run: docker ps