name: CD - Deploy 🚀

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Login to JFrog
      - name: Docker Login
        run: |
          docker login trialuy8zrn.jfrog.io -u ${{ secrets.JFROG_USERNAME }} -p ${{ secrets.JFROG_TOKEN }}

      # Stop old container (if exists)
      - name: Stop old container
        run: |
          docker stop myapp || true
          docker rm myapp || true

      # Pull latest image
      - name: Pull Image
        run: |
          docker pull trialuy8zrn.jfrog.io/docker-trial/myapp:latest

      # Run container
      - name: Run Container 🚀
        run: |
          docker run -d -p 8080:80 \
          --name myapp \
          trialuy8zrn.jfrog.io/docker-trial/myapp:latest