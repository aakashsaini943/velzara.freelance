name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to JFrog Docker Registry
      - name: Login to JFrog Docker
        run: |
          echo ${{ secrets.JFROG_TOKEN }} | docker login trialuy8zrn.jfrog.io \
          -u ${{ secrets.JFROG_USERNAME }} \
          --password-stdin

      # 3. Pull and Run Container
      - name: Deploy Locally (Versioned)
        run: |
          docker pull trialuy8zrn.jfrog.io/docker-trial/myapp:latest

          VERSION=$(date +%s)

          docker run -d -p 8080:80 \
          --name myapp_v-$VERSION \
          trialuy8zrn.jfrog.io/docker-trial/myapp:latest

      
      - name: Install ngrok
        run: |
         sudo apt update
         sudo apt install unzip -y
         wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip
         unzip ngrok-v3-stable-linux-amd64.zip

      - name: Run ngrok
        run: |
         ./ngrok http 8080 > /dev/null &
         sleep 5
         curl http://localhost:4040/api/tunnels
