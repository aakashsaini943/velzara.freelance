name: CD - Deploy 🚀

on:
  workflow_run:
    workflows: ["CI - Build & Push 🚀"]
    types:
      - completed

env:
  REGISTRY: trialuy8zrn.jfrog.io/docker-trial
  IMAGE_NAME: myapp

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Login
      - name: Docker Login
        run: |
          echo ${{ secrets.JFROG_TOKEN }} | docker login trialuy8zrn.jfrog.io \
          -u ${{ secrets.JFROG_USERNAME }} --password-stdin

      # Deploy latest
      - name: Deploy Container 🚀
        run: |
          VERSION=${{ github.sha }}

          IMAGE=$REGISTRY/$IMAGE_NAME:latest

          echo "Deploying $IMAGE"

          docker pull $IMAGE

          docker run -d -p 0:80 \
          --name myapp_$RANDOM \
          $IMAGE

      # # Cleanup old containers (keep last 3)
