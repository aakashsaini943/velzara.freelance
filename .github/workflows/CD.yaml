name: CI/CD Pipeline

on:
  push:
    branches:
      - main

       #  Configure JFrog
      - name: Configure JFrog
        run: |
          ./jfrog config add my-server \
          --url=${{ secrets.JFROG_URL }} \
          --user=${{ secrets.JFROG_USERNAME }} \
          --apikey=${{ secrets.JFROG_TOKEN }} \
          --interactive=false    

     
      # pull Docker Image
      - name: Deploy Locally (Versioned)
        run: |
          docker pull trialuy8zrn.jfrog.io/docker-trial/myapp:latest

          VERSION=$(date +%s)

          docker run -d -p 8080:80 --name myapp_v-$VERSION trialuy8zrn.jfrog.io/docker-trial/myapp:latest      