name: CI - Build & Push 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: trialuy8zrn.jfrog.io/docker-trial
  IMAGE_NAME: myapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Version
        run: |
          VERSION=v$(date +'%Y.%m.%d-%H%M')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Image
        run: docker build -t myapp .

      - name: Docker Login
        run: |
          echo ${{ secrets.JFROG_TOKEN }} | docker login trialuy8zrn.jfrog.io \
          -u ${{ secrets.JFROG_USERNAME }} --password-stdin

      - name: Tag Image
        run: |
          docker tag myapp $REGISTRY/$IMAGE_NAME:${{ env.VERSION }}
          docker tag myapp $REGISTRY/$IMAGE_NAME:latest

      - name: Push Image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ env.VERSION }}
          docker push $REGISTRY/$IMAGE_NAME:latest